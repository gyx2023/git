kind: Deployment
apiVersion: apps/v1
metadata:
  name: zqzt-backend-job
  namespace: zjzqyypt2022
  annotations:
    ckp/alias-name: 政企中台新后端
    ckp/description: 政企中台新后端
    ckp/expectedReplicas: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      ckp/owner-name: zqzt-backend-job
  template:
    metadata:
      labels:
        ckp/owner-name: zqzt-backend-job
    spec:
      containers:
        - name: container-zqzt-backend-job
          image: huailaikxq-registry.cucloud.cn/zj_zq2025/zqzt-backend-job-prod
          ports:
            - name: tcp-backend
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 4096Mi
            requests:
              cpu: 200m
              memory: 2048Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      affinity: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
