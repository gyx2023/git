--- # HiAgent 智能问数配置
hiagent:
  # HiAgent 平台基础 URL（所有 Agent 共用同一平台）
  base-url: http://132.151.58.42:32300/api/proxy/api/v1
  # 创建会话 API 路径
  create-conversation-api: /create_conversation
  # 阻塞/流式聊天 API 路径
  chat-query-api: /chat_query_v2
  # 反馈 API 路径
  feedback-api: /feedback
  # 连接超时
  connect-timeout: 5s
  # 读取超时（blocking 模式需等待 AI 完整响应，建议 60s）
  read-timeout: 60s
  # 最大重试次数
  max-retries: 2
  # 重试间隔 (毫秒)
  retry-interval-ms: 1000
  # 意图识别 Agent ID（对应 agents 配置中的 key）
  intent-agent-id: intent_agent
  # 结果处理 Agent ID（对应 agents 配置中的 key）
  result-agent-id: result_agent
  # 语义查询 SQL Agent ID（对应 agents 配置中的 key）
  semantic-sql-agent-id: semantic_sql_agent
  # 多 Agent 工作流配置，key 为 agentId，apiKey 从 HiAgent 智能体预览页获取
  agents:
    intent_agent:
      # API Key 建议从环境变量注入，禁止硬编码
      api-key: d7le13m7tiq2rrjccq2g
      description: 意图识别 Agent（第一阶段：判断 intent 类型 + 置信度）
    tool_agent:
      # 工具参数提取 Agent（方案B 第二阶段：匹配 tool_name + 提取 entities）
      # API Key 从 HiAgent 平台新建智能体页获取
      api-key: ${HIAGENT_TOOL_AGENT_KEY:}
      description: 工具参数提取 Agent（识别具体报表工具名 + 提取调用参数）
    result_agent:
      # 结果处理 Agent：对工具调用返回的原始数据进行智能过滤和展示优化
      # 输入：用户原始查询 + IntentAgent 解析结果 + API 原始响应数据
      # 输出：过滤后数据 + 展示格式建议 + 摘要文本
      # API Key 从 HiAgent 平台新建智能体页获取
      api-key: d8lrbpu7tiq2rrjpaoqg
      description: 结果处理 Agent（后处理阶段：智能过滤、展示优化、摘要生成）
    semantic_sql_agent:
      # 语义查询 SQL Agent：根据用户问题 + metric 定义生成安全 SQL
      # 输入：用户原始查询 + entities + metricDefinitions
      # 输出：SQL + queryType + 展示信息
      api-key: ${HIAGENT_SEMANTIC_SQL_AGENT_KEY:d8ofv6mnlnbcfra80ts0}
      description: 语义查询 SQL Agent（生成安全 SQL，由后端沙箱执行）
  # 置信度校准配置
  calibration:
    enabled: false
    model-path: /models/calibrator.pkl
    min-confidence: 0.0
    max-confidence: 1.0
    short-query-penalty: 0.8
    short-query-length-threshold: 5
  # 熔断器配置
  circuit-breaker:
    failure-rate-threshold: 50.0
    wait-duration-in-open-state: 30s
    permitted-number-of-calls-in-half-open-state: 3
    sliding-window-size: 10

--- # ChinaUnicon 智能体配置
china-unicon-agent:
  # 控制 /askdata/chat/stream 的意图识别；同步 /askdata/query 仍走 HiAgent
  enabled: true
  base-url: https://ai-test.unicom.local
  chat-api: /uia/api/robot/chat/stream/v1
  app-id: 686304240312774656
  intent:
    enabled: true
    app-id: 694295166763388928
    # 工作流智能体填槽节点需要从 variable.input 读取用户输入
    pass-content-as-input: false
    input-variable-name: input
  result:
    enabled: true
    app-id: 694301181080752128
    # 结果处理智能体通过 variable.data 获取完整数据包，content 仅保留用户问题。
    pass-content-as-input: false
  semantic-sql:
    # 待创建/确认 ChinaUnicon 语义 SQL 智能体后填写 app-id，再将数据库开关设为 china_unicon
    enabled: false
    app-id: ""
    pass-content-as-input: false
    input-variable-name: input
  team-id: 1724421776279
  sk: sk-4rrvB7rWjbxpvWIDP-4yzJBKax6H0P6ihqV--lWSFH4
  stream: false
  # 仅测试环境临时联调使用，其他环境必须保持 false。
  insecure-tls: false
  connect-timeout: 5s
  read-timeout: 180s

--- # 智能问数路由决策配置
askdata:
  embed:
    # 内网 iframe 嵌入模式：允许无 zqzt 登录态访问，但必须携带宿主 Authorization
    enabled: true
    require-auth-header: true
    # 宿主 OA 字段暂不强制，待 smart-brain-vue 传参稳定后可改为 true
    require-oa: false
    # 内网联调阶段暂不限制宿主来源；生产如需收紧可配置宿主域名
    allowed-origins: []
  router:
    # 置信度閘值配置
    confidence-thresholds:
      high: 0.85
      medium: 0.60
      low: 0.40
    # 安全配置
    security:
      enable-sql-sandbox: false
      default-fallback: FALLBACK_KB
    # 延迟预算配置 (毫秒)
    budget:
      intent-recognition: 1000
      routing-decision: 200
      query-execution: 1500
      total: 3000
    # 回退配置
    retry:
      max-retries: 2
      reversible-strategies:
        - TEXT_TO_SQL
        - SEMANTIC_QUERY
  # 语义层元数据管理配置
  metadata:
    cache:
      # L1 本地缓存 TTL
      l1-ttl: 5m
      # L1 缓存最大条数
      l1-max-size: 10000
      # L2 Redis 缓存 TTL
      l2-ttl: 30m
      # 预热开关
      warmup-enabled: true
    event:
      # 事件异步处理
      async-enabled: true
      # 事件保留天数
      retention-days: 90
      # 通知活跃会话
      notify-sessions: true
    validation:
      # 枚举值校验
      enum-validation: true
      # 表达式校验
      expression-validation: true
      # 代码格式校验
      code-pattern: "^[a-z][a-z0-9_]{0,49}$"
  # 工具调用执行器配置 (BE-07)
  tool-call:
    security:
      # 已启用工具白名单
      enabled-tools:
        - get_sales_report
        - get_user_growth
        - get_operation_report
      # 敏感工具列表 (需额外授权)
      sensitive-tools:
        - get_finance_report
        - export_data
      # 强制权限校验
      enforce-permission: true
    performance:
      # 调用超时 (秒)
      timeout-seconds: 5
      # 最大重试次数
      max-retries: 2
      # 重试间隔 (毫秒)
      retry-interval-ms: 1000
      # 并发限制
      max-concurrent-calls: 50
    fallback:
      # 启用降级
      enabled: true
      # 降级策略
      strategy: SEMANTIC_QUERY
      # 降级提示模板
      message-template: "工具调用失败，已降级到 {fallback_strategy}"
    audit:
      # 启用审计日志
      enabled: true
      # 记录请求参数
      log-request-params: true
      # 记录响应数据 (关闭防止敏感数据泄露)
      log-response-data: false
      # 审计日志保留天数
      retention-days: 180
