--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false


--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: true
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        #  主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:mysql://192.168.124.160:2883/zj_sj_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username: ENC(n4NjlFkdF/vApHwVTyCovgNO/NH919FhU5XWdIggCw2KHIaRdaaJhD7oC93P0Gruw/ZQ9KmCMIBr4GZjVUX50A==)
          password: ENC(U4ZQ/g0FWdUsXwQ3RDe4HbOgrWNzrnUojcCeYRKpZb8=)
        # 从库数据源
        slave:
          lazy: true
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.124.160:2883/test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username: ENC(n4NjlFkdF/vApHwVTyCovgNO/NH919FhU5XWdIggCw2KHIaRdaaJhD7oC93P0Gruw/ZQ9KmCMIBr4GZjVUX50A==)
          password: ENC(U4ZQ/g0FWdUsXwQ3RDe4HbOgrWNzrnUojcCeYRKpZb8=)
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000

  # RabbitMQ配置
  rabbitmq:
    # 服务器地址
    host: localhost
    # 端口号
    port: 5672
    # 用户名
    username: ENC(eArBvLPQhIEW3FOzYBnbvPFo77H4XNHsT+CLHZzRabI=)
    # 密码
    password: ENC(naTTKpQ8vDYZSWIlQJ97J7Gifw6Ug13Ql1NVQNNPlR8=)
    # 虚拟主机
    virtual-host: /
    # 连接超时时间
    connection-timeout: 15000
    # 消费者手动确认
    listener:
      simple:
        acknowledge-mode: manual
        # 并发消费者数量
        concurrency: 5
        # 最大并发消费者数量
        max-concurrency: 10
        # 预取数量
        prefetch: 1
        retry:
          enabled: false # 关闭内置重试机制，使用手动重试逻辑
    # 生产者确认
    publisher-confirm-type: correlated
    # 生产者返回
    publisher-returns: true
    # 模板强制返回
    template:
      mandatory: true

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring:
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码(如没有密码请注释掉)
    # password:
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl: false

redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${crm.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50
