--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /crm/server/temp

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.oceanbase.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:oceanbase:loadbalance://10.129.161.149:3306,10.129.161.173:3306,10.129.161.208:3306/zj_sj?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&autoReconnect=true&serverTimezone=Asia/Shanghai&useLocalSessionState=true&socketTimeout=3000000&connectTimeout=60000&rewriteBatchedStatements=true&useServerPrepStmts=false&allowMultiQueries=true
          username: ENC(R9ZmRfuO5ZSghBrWE9fdEb9COl1D6zyD+csnckyQPzA5lh8mI98b32nP+3MCXMH2PhUDoJ+0O1UoTtdrQ2IHpg==)
          password: ENC(+YIRVJ6VZEuJihkFznbhbr3eQ6xlRkr5f7x2ZemazfRRLTZDuHwXNFcjitlP9ech)
        # 从库数据源
        slave_1:
          lazy: true
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://10.173.59.21:3306/zq_user_36?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true&trackSessionState=true
          username: ENC(RtcKQxdjKiPbZr+2tzozWxVu/9qYAvdGD1boi/wr5SWrD5WD/kUxCcmPO/mwLxhY)
          password: ENC(sE9ABt/0R8w2gp+XXcsAEwv0nUBXw9lwSgc79d5oWKM=)
        slave_2:
          lazy: true
          type: ${spring.datasource.type}
          driverClassName: dm.jdbc.driver.DmDriver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:dm://10.129.69.127:1521/IOB_GOV2?columnNameUpperCase=false
          username: ENC(M2vgFuOSf9qRpfXYDbVXa3UGid5UX+cCBVLHZ0gKXEQ=)
          password: ENC(TkvypC5nYDNLn+eNPWI9nJUVw/DFl2Of4qL+CRh7pzY=)
        oracle:
          type: ${spring.datasource.type}
          driverClassName: oracle.jdbc.OracleDriver
          url: jdbc:oracle:thin:@132.151.15.102:5236:crmdb
          username: ENC(n/jiMAMsbMqvmOfvGjhbMHhvpTZ4hMbusQbnDqf5tfk=)
          password: ENC(sludqH/r4z8xfP5oU/nVbXi+e0uemgGuzr8FsJxS1UY=)
          hikari:
            connectionTestQuery: SELECT 1 FROM DUAL
            connection-init-sql: "ALTER SESSION SET CURRENT_SCHEMA=zjucrm2o"
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring:
  redis:
    # 地址
    host: redis.zjzqyypt2022
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码(如没有密码请注释掉)
    password: ENC(K5Cd93h18eAlbJdfeMs7DCaQN8hY5VjYGoi8Dbc/FJ8=)
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl: false

redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 16
  # Netty线程池数量
  nettyThreads: 32
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${crm.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 32
    # 连接池大小
    connectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信
sms:
  enabled: false
  # 阿里云 dysmsapi.aliyuncs.com
  # 腾讯云 sms.tencentcloudapi.com
  endpoint: "dysmsapi.aliyuncs.com"
  accessKeyId: xxxxxxx
  accessKeySecret: xxxxxx
  signName: 测试
  # 腾讯专用
  sdkAppId:
# security配置
security:
  # 排除路径
  excludes:
    # 静态资源
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    # 公共路径
    - /favicon.ico
    - /error
    # SSO自动登录接口
    - /sso/autoLogin
    - /zqzt_backend/health/**
    - /sso/portalCheck
    - /sso/uacLogin
# Swagger配置
swagger:
  info:
    # 标题
    title: '标题：${crm.name}后台管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${zqzt_backend.version}'
    # 作者信息
    contact:
      name: KonBAI
      email: 1527468660@qq.com
      url: https://gitee.com/KonBAI-Q/zqzt_backend
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}
springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: false
  swagger-ui:
    # 持久化认证数据
    persistAuthorization: true
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: com.crm.demo
    - group: 2.系统模块
      packages-to-scan: com.crm.web
    - group: 3.代码生成模块
      packages-to-scan: com.crm.generator
--- # flowable
flowable:
  database-schema: zj_sj
kafka:
  # 集群地址
  bootstrap-servers: 10.189.29.75:32005,10.189.29.80:32020,10.189.29.92:32011
  # 接口日志主题名称
  topic:
    interface-log: zqyy-interface-logs

  # 生产者核心参数
  producer:
    retries: 1
    acks: -1                  # 对应您的示例 `acks: "-1"`，表示需要所有ISR副本确认
    batch-size: 16384
    linger-ms: 0              # 对应您的示例，不延迟发送
    buffer-memory: 102400     # 对应您的示例，单位是KB，这里换算为字节 102400 * 1024? 但示例是102400，通常buffer.memory是字节，这里保持与示例一致
    # 注意：示例中 `buffer.memory` 值较小，可能在生产环境下需调大，如 33554432 (32MB)

  # SASL/SCRAM 安全认证配置 (必填，与您的示例匹配)
  security:
    # 安全协议，使用 SASL_PLAINTEXT 或 SASL_SSL (如果集群启用了SSL)
    protocol: SASL_PLAINTEXT
    sasl:
      # 认证机制
      mechanism: SCRAM-SHA-256
      # JAAS 配置，包含用户名和密码
      jaas-config: org.apache.kafka.common.security.scram.ScramLoginModule required username="zqyy-interface-log-user" password="zqyy##ZJlt1116";
