# 项目相关配置
crm:
  # 名称
  name: zqzt_backend
  # 版本
  version: ${zqzt_backend.version}
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: true
  # 获取ip地址开关
  addressEnabled: true
  # 缓存懒加载
  cacheLazy: false
  # MQ启用开关
  mq:
    enabled: false

captcha:
  # 页面 <参数设置> 可开启关闭 验证码校验
  # 验证码类型 math 数组计算 char 字符验证
  type: MATH
  # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
  category: CIRCLE
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

# 日志配置
logging:
  level:
    com.crm: @logging.level@
    org.springframework: warn
    com.crm.framework.interceptor.PlusDataPermissionInterceptor: info
  config: classpath:logback-spring.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: ${crm.name}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期 设为一天 (必定过期) 单位: 秒
  timeout: 86400
  # token临时有效期 (指定时间无操作就过期) 单位: 秒
  activity-timeout: 86400
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # 是否尝试从url参数里读取token（EventSource/SSE 场景使用）
  is-read-url: true
  # token前缀
  token-prefix: "Bearer"
  # jwt秘钥
  jwt-secret-key: b287d8a8da33a2f82250ddc2cb2d53437c9c9565a8473bd8aee0329bd50e52b3erty

# security配置
security:
  # 排除路径
  excludes:
    # 静态资源
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    # 公共路径
    - /favicon.ico
    - /error
    # swagger 文档配置
    - /*/api-docs
    - /*/api-docs/**
    # actuator 监控配置
    - /actuator
    - /actuator/**
    # SSO自动登录接口
    - /sso/autoLogin
    - /api/askdata/tools/schemas

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 不支持多包, 如有需要可在注解配置 或 提升扫包等级
  # 例如 com.**.**.mapper
  mapperPackage: com.crm.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.crm.**.domain,com.crm.generator.**.domain
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  checkConfigLocation: false
  configuration:
    # 自动驼峰命名规则（camel case）映射
    mapUnderscoreToCamelCase: true
    # MyBatis 自动映射策略
    # NONE：不启用 PARTIAL：只对非嵌套 resultMap 自动映射 FULL：对所有 resultMap 自动映射
    autoMappingBehavior: PARTIAL
    # MyBatis 自动映射时未知列或未知属性处理策
    # NONE：不做处理 WARNING：打印相关警告 FAILING：抛出异常和详细信息
    autoMappingUnknownColumnBehavior: NONE
    # 更详细的日志输出 会有性能损耗 org.apache.ibatis.logging.stdout.StdOutImpl
    # 关闭日志记录 (可单纯使用 p6spy 分析) org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 默认日志输出 org.apache.ibatis.logging.slf4j.Slf4jImpl
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # 是否打印 Logo banner
    banner: true
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      idType: ASSIGN_ID
      # 逻辑已删除值
      logicDeleteValue: 2
      # 逻辑未删除值
      logicNotDeleteValue: 0
      # 字段验证策略之 insert,在 insert 的时候的字段验证策略
      # IGNORED 忽略 NOT_NULL 非NULL NOT_EMPTY 非空 DEFAULT 默认 NEVER 不加入 SQL
      insertStrategy: NOT_NULL
      # 字段验证策略之 update,在 update 的时候的字段验证策略
      updateStrategy: NOT_NULL
      # 字段验证策略之 select,在 select 的时候的字段验证策略既 wrapper 根据内部 entity 生成的 where 条件
      where-strategy: NOT_NULL

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# Swagger配置
swagger:
  info:
    # 标题
    title: '标题：${crm.name}后台管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${zqzt_backend.version}'
    # 作者信息
    contact:
      name: KonBAI
      email: 1527468660@qq.com
      url: https://gitee.com/KonBAI-Q/zqzt_backend
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  swagger-ui:
    # 持久化认证数据
    persistAuthorization: true
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: com.crm.demo
    - group: 2.系统模块
      packages-to-scan: com.crm.web
    - group: 3.代码生成模块
      packages-to-scan: com.crm.generator

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: false
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # Flowable 配置
flowable:
  # 关闭定时任务 job
  async-executor-activate: false
  # 关闭自动更新数据库表结构，避免表已存在的错误
  database-schema-update: false
  idm:
    # 关闭idm引擎 数据库不会创建act_id_*表，流程流转不会使用act_id_*相关的表
    enabled: false
  # 关闭流程定义文件自动检查
  check-process-definitions: false
  # 关闭历史任务定时任务job
  async-history-executor-activate: false

--- # HiAgent 智能问数配置
hiagent:
  # HiAgent 平台基础 URL（所有 Agent 共用同一平台）
  base-url: http://192.168.124.160:32300/api/proxy/api/v1
  # 创建会话 API 路径
  create-conversation-api: /create_conversation
  # 阻塞/流式聊天 API 路径
  chat-query-api: /chat_query_v2
  # 反馈 API 路径
  feedback-api: /feedback
  # 连接超时
  connect-timeout: 5s
  # 读取超时（blocking 模式需等待 AI 完整响应，建议 60s）
  read-timeout: 60s
  # 最大重试次数
  max-retries: 2
  # 重试间隔 (毫秒)
  retry-interval-ms: 1000
  # 意图识别 Agent ID（对应 agents 配置中的 key）
  intent-agent-id: intent_agent
  # 多 Agent 工作流配置，key 为 agentId，apiKey 从 HiAgent 智能体预览页获取
  agents:
    intent_agent:
      # API Key 建议从环境变量注入，禁止硬编码
      api-key: d7le13m7tiq2rrjccq2g
      description: 意图识别 Agent（第一阶段：判断 intent 类型 + 置信度）
    tool_agent:
      # 工具参数提取 Agent（方案B 第二阶段：匹配 tool_name + 提取 entities）
      # API Key 从 HiAgent 平台新建智能体页获取
      api-key: ${HIAGENT_TOOL_AGENT_KEY:}
      description: 工具参数提取 Agent（识别具体报表工具名 + 提取调用参数）
  # 置信度校准配置
  calibration:
    enabled: false
    model-path: /models/calibrator.pkl
    min-confidence: 0.0
    max-confidence: 1.0
    short-query-penalty: 0.8
    short-query-length-threshold: 5
  # 熔断器配置
  circuit-breaker:
    failure-rate-threshold: 50.0
    wait-duration-in-open-state: 30s
    permitted-number-of-calls-in-half-open-state: 3
    sliding-window-size: 10

--- # 智能问数路由决策配置
askdata:
  router:
    # 置信度閘值配置
    confidence-thresholds:
      high: 0.85
      medium: 0.60
      low: 0.40
    # 安全配置
    security:
      enable-sql-sandbox: true
      default-fallback: FALLBACK_KB
    # 延迟预算配置 (毫秒)
    budget:
      intent-recognition: 1000
      routing-decision: 200
      query-execution: 1500
      total: 3000
    # 回退配置
    retry:
      max-retries: 2
      reversible-strategies:
        - TEXT_TO_SQL
        - SEMANTIC_QUERY
  # 语义层元数据管理配置
  metadata:
    cache:
      # L1 本地缓存 TTL
      l1-ttl: 5m
      # L1 缓存最大条数
      l1-max-size: 10000
      # L2 Redis 缓存 TTL
      l2-ttl: 30m
      # 预热开关
      warmup-enabled: true
    event:
      # 事件异步处理
      async-enabled: true
      # 事件保留天数
      retention-days: 90
      # 通知活跃会话
      notify-sessions: true
    validation:
      # 枚举值校验
      enum-validation: true
      # 表达式校验
      expression-validation: true
      # 代码格式校验
      code-pattern: "^[a-z][a-z0-9_]{0,49}$"
  # 工具调用执行器配置 (BE-07)
  tool-call:
    security:
      # 已启用工具白名单
      enabled-tools:
        - get_sales_report
        - get_user_growth
        - get_operation_report
      # 敏感工具列表 (需额外授权)
      sensitive-tools:
        - get_finance_report
        - export_data
      # 强制权限校验
      enforce-permission: true
    performance:
      # 调用超时 (秒)
      timeout-seconds: 5
      # 最大重试次数
      max-retries: 2
      # 重试间隔 (毫秒)
      retry-interval-ms: 1000
      # 并发限制
      max-concurrent-calls: 50
    fallback:
      # 启用降级
      enabled: true
      # 降级策略
      strategy: SEMANTIC_QUERY
      # 降级提示模板
      message-template: "工具调用失败，已降级到 {fallback_strategy}"
    audit:
      # 启用审计日志
      enabled: true
      # 记录请求参数
      log-request-params: true
      # 记录响应数据 (关闭防止敏感数据泄露)
      log-response-data: false
      # 审计日志保留天数
      retention-days: 180
